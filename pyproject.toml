[project]
name = "parley"
version = "0.1.0"
description = "Open-source conversation QA: every score has a receipt."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "fastapi>=0.142.2",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6",
    "uvicorn>=0.54.0",
]

[project.scripts]
parley = "parley.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
